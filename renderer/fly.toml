# Fly.io deployment configuration for Render Service
# Deploy with: fly deploy --config renderer/fly.toml

app = "scory-render-service"
primary_region = "mia"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3333"
  NODE_ENV = "production"
  MAX_CONCURRENT = "3"

[http_service]
  internal_port = 3333
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024
