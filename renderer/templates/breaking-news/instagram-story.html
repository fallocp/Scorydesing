<!DOCTYPE html>
<html lang="es" style="width:1080px;height:1920px;margin:0;padding:0;">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600;700&family=Fraunces:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --color-turquoise: #2ED4C7;
  --color-coral: #FF7A4A;
  --color-navy: #0F1419;
  --font-display: 'Montserrat', Arial, sans-serif;
  --font-body: 'Poppins', Arial, sans-serif;
  --font-numbers: 'JetBrains Mono', 'Courier New', monospace;
  --font-legal: 'Fraunces', Georgia, serif;
}
html, body {
  width: 1080px;
  height: 1920px;
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: var(--font-body);
  color: #FFFFFF;
}
body {
  position: relative;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(ellipse at 20% 50%, var(--color-turquoise) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, var(--color-coral) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, var(--color-turquoise) 0%, transparent 60%),
    var(--color-navy);
}
body::after {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0.08;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  background-size: 128px 128px;
  pointer-events: none;
  z-index: 1;
}
.content-wrapper {
  position: relative;
  z-index: 2;
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 48px;
  box-sizing: border-box;
}
/* Brand lockup */
.brand-lockup { display: flex; align-items: baseline; gap: 8px; margin-bottom: 24px; }
.brand-wordmark { font-family: var(--font-display); font-size: 32px; font-weight: 700; letter-spacing: 0.12em; color: #FFFFFF; }
.brand-sublabel { font-family: var(--font-body); font-size: 16px; font-weight: 600; letter-spacing: 0.08em; color: var(--color-coral); }
/* Image area */
.image-area { width: 100%; height: 640px; border-radius: 16px; overflow: hidden; margin-bottom: 32px; }
.image-area img { width: 100%; height: 100%; object-fit: cover; }
/* Content */
.breaking-label { font-family: var(--font-body); font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; color: var(--color-coral); margin-bottom: 16px; }
.headline { font-family: var(--font-display); font-size: 56px; font-weight: 700; line-height: 1.1; margin-bottom: 20px; }
.subcopy { font-family: var(--font-body); font-size: 24px; line-height: 1.4; color: rgba(255,255,255,0.85); margin-bottom: 20px; }
.data-point { font-family: var(--font-numbers); font-size: 48px; font-weight: 700; color: var(--color-turquoise); margin-bottom: 16px; }
.meta-row { display: flex; gap: 24px; font-family: var(--font-body); font-size: 18px; color: rgba(255,255,255,0.6); margin-bottom: 24px; }
.cta { display: inline-block; font-family: var(--font-body); font-size: 22px; font-weight: 600; padding: 16px 40px; background: var(--color-coral); color: #FFFFFF; border-radius: 8px; margin-bottom: 32px; align-self: flex-start; }
/* Partner badge */
.partner-badge { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.partner-badge img { height: 28px; width: auto; }
.partner-badge span { font-family: var(--font-body); font-size: 14px; color: rgba(255,255,255,0.7); }
/* Promoter area */
.promoter-area { display: flex; align-items: center; gap: 12px; padding: 16px; background: rgba(255,255,255,0.08); border-radius: 8px; margin-bottom: 16px; }
.promoter-area.hidden { display: none; }
.promoter-photo { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; }
.promoter-info { display: flex; flex-direction: column; gap: 2px; }
.promoter-name { font-size: 16px; font-weight: 600; }
.promoter-role { font-size: 14px; color: rgba(255,255,255,0.7); }
.promoter-contact { font-size: 12px; color: rgba(255,255,255,0.6); }
/* Disclaimer */
.disclaimer { margin-top: auto; font-family: var(--font-legal); font-size: 14px; line-height: 1.3; color: rgba(255,255,255,0.5); padding-top: 16px; }
</style>
</head>
<body>
<div class="content-wrapper">
  {{brandLockup}}

  <div class="image-area">
    <img src="{{imageUrl}}" alt="" />
  </div>

  <div class="breaking-label">Breaking News</div>
  <div class="headline">{{headline}}</div>
  <div class="data-point">{{dataPoint}}</div>
  <div class="subcopy">{{subcopy}}</div>
  <div class="meta-row">
    <span>{{date}}</span>
    <span>{{source}}</span>
  </div>

  <div class="cta">{{cta}}</div>

  {{partnerBadge}}
  {{promoterArea}}
  {{disclaimer}}
</div>
</body>
</html>
