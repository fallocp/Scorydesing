<!DOCTYPE html>
<html lang="es" style="width:1080px;height:1080px;margin:0;padding:0;">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --color-turquoise: #2ED4C7; --color-coral: #FF7A4A; --color-navy: #0F1419; --font-display: 'Fraunces', Georgia, serif; --font-body: 'Inter', Arial, sans-serif; --font-numbers: 'JetBrains Mono', 'Courier New', monospace; }
html, body { width: 1080px; height: 1080px; margin: 0; padding: 0; overflow: hidden; font-family: var(--font-body); color: #FFFFFF; }
body { position: relative; display: flex; flex-direction: column; background: var(--color-navy); }
.bg-mesh { position: absolute; inset: 0; background: radial-gradient(ellipse 600px 500px at 80% 20%, rgba(255,120,70,0.07) 0%, transparent 60%), radial-gradient(ellipse 700px 600px at 10% 80%, rgba(46,212,199,0.09) 0%, transparent 60%); pointer-events: none; }
.grain { position: absolute; inset: 0; opacity: 0.08; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E"); background-size: 128px 128px; }
.content-wrapper { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; padding: 44px; box-sizing: border-box; align-items: center; justify-content: center; text-align: center; }
.brand-lockup { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.brand-logo { width: 52px; height: 52px; object-fit: contain; }
.brand-wordmark { font-family: var(--font-body); font-size: 28px; font-weight: 700; color: #FFFFFF; }
.brand-sublabel { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--color-coral); margin-left: 6px; }
.headline { font-family: var(--font-display); font-size: 44px; font-weight: 700; line-height: 1.1; margin-bottom: 14px; }
.accent-coral { font-style: italic; background: linear-gradient(135deg, #FF7A4A, #E85A2C); -webkit-background-clip: text; background-clip: text; color: transparent; }
.accent-tq { font-style: italic; background: linear-gradient(135deg, #2ED4C7, #1FB8AC); -webkit-background-clip: text; background-clip: text; color: transparent; }
.subcopy { font-size: 18px; line-height: 1.4; color: rgba(255,255,255,0.7); margin-bottom: 18px; }
.image-area { width: 380px; height: 280px; border-radius: 16px; overflow: hidden; margin-bottom: 18px; position: relative; }
.image-area img { width: 100%; height: 100%; object-fit: cover; }
.image-overlay { position: absolute; inset: 0; background: rgba(15,20,25,0.2); border-radius: 16px; }
.stat-pill { display: inline-flex; align-items: center; gap: 10px; padding: 10px 20px; border-radius: 100px; background: rgba(255,255,255,0.08); margin-bottom: 14px; }
.stat-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-turquoise); box-shadow: 0 0 10px rgba(46,212,199,0.8); }
.stat-text { font-family: var(--font-numbers); font-size: 16px; font-weight: 700; }
.cta { display: inline-block; font-family: var(--font-body); font-size: 18px; font-weight: 700; padding: 14px 32px; background: linear-gradient(135deg, #2ED4C7, #1FB8AC); color: var(--color-navy); border-radius: 100px; margin-bottom: 14px; }
.partner-badge { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
.partner-badge img { height: 20px; width: auto; }
.partner-badge span { font-size: 11px; color: rgba(255,255,255,0.5); }
.promoter-area { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: rgba(255,255,255,0.06); border-radius: 10px; margin-bottom: 10px; }
.promoter-area.hidden { display: none; }
.promoter-photo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--color-turquoise); }
.promoter-info { display: flex; flex-direction: column; gap: 1px; text-align: left; }
.promoter-name { font-size: 12px; font-weight: 600; }
.promoter-role { font-size: 11px; color: rgba(255,255,255,0.6); }
.promoter-contact { font-size: 10px; color: rgba(255,255,255,0.5); }
.disclaimer { font-size: 11px; line-height: 1.3; color: rgba(255,255,255,0.35); margin-top: 8px; }
</style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="grain"></div>
<div class="content-wrapper">
  {{brandLockup}}
  <div class="headline">{{headline}}</div>
  <div class="subcopy">{{subcopy}}</div>
  <div class="image-area"><img src="{{imageUrl}}" alt="" /><div class="image-overlay"></div></div>
  <div class="stat-pill"><span class="stat-dot"></span><span class="stat-text">{{dataPoint}}</span></div>
  <div class="cta">{{cta}}</div>
  {{partnerBadge}}
  {{promoterArea}}
  <div class="disclaimer">{{disclaimer}}</div>
</div>
</body>
</html>
