<!DOCTYPE html>
<html lang="es" style="width:1200px;height:628px;margin:0;padding:0;">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600;700&family=Fraunces:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --color-turquoise: #2ED4C7;
  --color-coral: #FF7A4A;
  --color-navy: #0F1419;
  --font-display: 'Montserrat', Arial, sans-serif;
  --font-body: 'Poppins', Arial, sans-serif;
  --font-numbers: 'JetBrains Mono', 'Courier New', monospace;
  --font-legal: 'Fraunces', Georgia, serif;
}
html, body {
  width: 1200px;
  height: 628px;
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: var(--font-body);
  color: #FFFFFF;
}
body {
  position: relative;
  display: flex;
  background:
    radial-gradient(ellipse at 20% 50%, var(--color-turquoise) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, var(--color-coral) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, var(--color-turquoise) 0%, transparent 60%),
    var(--color-navy);
}
body::after {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0.08;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  background-size: 128px 128px;
  pointer-events: none;
  z-index: 1;
}
.content-wrapper {
  position: relative;
  z-index: 2;
  flex: 1;
  display: flex;
  flex-direction: row;
  padding: 36px;
  box-sizing: border-box;
  gap: 36px;
}
.text-column { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.image-column { width: 380px; display: flex; align-items: center; }
.image-column img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
.brand-lockup { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
.brand-wordmark { font-family: var(--font-display); font-size: 24px; font-weight: 700; letter-spacing: 0.12em; }
.brand-sublabel { font-family: var(--font-body); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--color-coral); }
.section-label { font-family: var(--font-body); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; color: var(--color-coral); margin-bottom: 8px; }
.big-number { font-family: var(--font-numbers); font-size: 56px; font-weight: 700; color: var(--color-turquoise); line-height: 1; margin-bottom: 8px; }
.context-label { font-family: var(--font-body); font-size: 18px; color: rgba(255,255,255,0.85); margin-bottom: 4px; }
.period { font-family: var(--font-body); font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 12px; }
.headline { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.1; margin-bottom: 8px; }
.subcopy { font-family: var(--font-body); font-size: 15px; line-height: 1.4; color: rgba(255,255,255,0.85); margin-bottom: 10px; }
.cta { display: inline-block; font-family: var(--font-body); font-size: 15px; font-weight: 600; padding: 10px 28px; background: var(--color-coral); color: #FFFFFF; border-radius: 8px; margin-bottom: 10px; align-self: flex-start; }
.partner-badge { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.partner-badge img { height: 20px; width: auto; }
.partner-badge span { font-size: 11px; color: rgba(255,255,255,0.7); }
.promoter-area { display: flex; align-items: center; gap: 10px; padding: 10px; background: rgba(255,255,255,0.08); border-radius: 8px; margin-bottom: 8px; }
.promoter-area.hidden { display: none; }
.promoter-photo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
.promoter-info { display: flex; flex-direction: column; gap: 2px; }
.promoter-name { font-size: 13px; font-weight: 600; }
.promoter-role { font-size: 11px; color: rgba(255,255,255,0.7); }
.promoter-contact { font-size: 10px; color: rgba(255,255,255,0.6); }
.disclaimer { font-family: var(--font-legal); margin-top: auto; font-size: 12px; line-height: 1.3; color: rgba(255,255,255,0.5); padding-top: 6px; }
</style>
</head>
<body>
<div class="content-wrapper">
  <div class="text-column">
    {{brandLockup}}
    <div class="section-label">Stat of the Day</div>
    <div class="big-number">{{bigNumber}}</div>
    <div class="context-label">{{contextLabel}}</div>
    <div class="period">{{period}}</div>
    <div class="headline">{{headline}}</div>
    <div class="subcopy">{{subcopy}}</div>
    <div class="cta">{{cta}}</div>
    {{partnerBadge}}
    {{promoterArea}}
    {{disclaimer}}
  </div>
  <div class="image-column">
    <img src="{{imageUrl}}" alt="" />
  </div>
</div>
</body>
</html>
