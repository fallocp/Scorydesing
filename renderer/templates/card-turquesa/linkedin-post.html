<!DOCTYPE html>
<html lang="es" style="width:1200px;height:627px;margin:0;padding:0;">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --color-turquoise: #2ED4C7; --color-coral: #FF7A4A; --color-navy: #0F1419; --color-cream: #F5F3F0; --font-display: 'Fraunces', Georgia, serif; --font-body: 'Inter', Arial, sans-serif; --font-numbers: 'JetBrains Mono', 'Courier New', monospace; }
html, body { width: 1200px; height: 627px; margin: 0; padding: 0; overflow: hidden; font-family: var(--font-body); color: var(--color-navy); }
body { position: relative; display: flex; background: #E8FAF8; }
.bg-mesh { position: absolute; inset: 0; background: radial-gradient(ellipse 500px 400px at 85% 20%, rgba(46,212,199,0.22) 0%, transparent 60%), radial-gradient(ellipse 600px 500px at 10% 80%, rgba(46,212,199,0.16) 0%, transparent 60%), radial-gradient(ellipse 400px 300px at 50% 50%, rgba(255,255,255,0.5) 0%, transparent 70%), linear-gradient(180deg, #E8FAF8 0%, #D4F5F2 100%); pointer-events: none; }
.grain { position: absolute; inset: 0; opacity: 0.06; mix-blend-mode: multiply; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E"); background-size: 128px 128px; }
.image-side { width: 48%; height: 100%; position: relative; z-index: 2; }
.image-side img { width: 100%; height: 100%; object-fit: cover; }
.content-side { width: 52%; height: 100%; position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: center; padding: 36px 44px; box-sizing: border-box; }
.brand-lockup { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.brand-logo { width: 40px; height: 40px; object-fit: contain; }
.brand-wordmark { font-family: var(--font-body); font-size: 24px; font-weight: 700; color: var(--color-navy); }
.brand-sublabel { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: var(--color-turquoise); margin-left: 4px; }
.headline { font-family: var(--font-display); font-size: 32px; font-weight: 600; line-height: 1.1; margin-bottom: 10px; color: var(--color-navy); }
.accent-coral { font-style: italic; background: linear-gradient(135deg, #FF7A4A, #E85A2C); -webkit-background-clip: text; background-clip: text; color: transparent; }
.accent-tq { font-style: italic; background: linear-gradient(135deg, #2ED4C7, #1FB8AC); -webkit-background-clip: text; background-clip: text; color: transparent; }
.subcopy { font-size: 15px; line-height: 1.4; color: #333; margin-bottom: 14px; }
.stat-pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 100px; background: rgba(46,212,199,0.10); margin-bottom: 14px; }
.stat-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-turquoise); box-shadow: 0 0 8px rgba(46,212,199,0.8); }
.stat-text { font-family: var(--font-numbers); font-size: 13px; font-weight: 700; color: var(--color-navy); }
.accent-bar { height: 3px; background: linear-gradient(90deg, var(--color-turquoise), var(--color-coral)); border-radius: 2px; margin-bottom: 14px; }
.cta { display: inline-block; font-family: var(--font-body); font-size: 15px; font-weight: 600; padding: 11px 26px; background: linear-gradient(135deg, #2ED4C7, #1FB8AC); color: #FFFFFF; border-radius: 100px; align-self: flex-start; margin-bottom: 10px; }
.partner-badge { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.partner-badge img { height: 16px; width: auto; }
.partner-badge span { font-size: 10px; color: rgba(15,20,25,0.5); }
.promoter-area { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: rgba(46,212,199,0.08); border-radius: 8px; margin-bottom: 6px; }
.promoter-area.hidden { display: none; }
.promoter-photo { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid var(--color-turquoise); }
.promoter-info { display: flex; flex-direction: column; gap: 1px; }
.promoter-name { font-size: 11px; font-weight: 600; color: var(--color-navy); }
.promoter-role { font-size: 10px; color: #666; }
.promoter-contact { font-size: 9px; color: #999; }
.disclaimer { font-size: 10px; line-height: 1.3; color: rgba(15,20,25,0.4); }
</style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="grain"></div>
<div class="image-side"><img src="{{imageUrl}}" alt="" /></div>
<div class="content-side">
  {{brandLockup}}
  <div class="headline">{{headline}}</div>
  <div class="subcopy">{{subcopy}}</div>
  <div class="stat-pill"><span class="stat-dot"></span><span class="stat-text">{{dataPoint}}</span></div>
  <div class="accent-bar"></div>
  <div class="cta">{{cta}}</div>
  {{partnerBadge}}
  {{promoterArea}}
  <div class="disclaimer">{{disclaimer}}</div>
</div>
</body>
</html>
