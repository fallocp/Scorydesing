# Include inside the existing server block that serves ScoryDesign.
# Node runs on 127.0.0.1:3333 with NODE_ENV=production and the project's
# SUPABASE_URL + SUPABASE_ANON_KEY (public configuration, never service-role).
location = /renderer/design-preview {
    client_max_body_size 24m;
    proxy_pass http://127.0.0.1:3333/design-preview;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 130s;
}

location = /renderer/reference-import {
    client_max_body_size 24m;
    proxy_pass http://127.0.0.1:3333/reference-import;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 130s;
}

# Keep legacy export/admin endpoints off this new public route.
location /renderer/ {
    return 404;
}
