# Supabase local propio de ScoryDesign (ADR-0001). Solo local: puertos 55320-55329,
# red scorydesign-supabase-local (127.0.0.1) y regla de Firewall "scorydesign - Supabase local only".
# Runbook: docs/LOCAL_INFRASTRUCTURE_RUNBOOK.md
# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "scorydesign"

[api]
enabled = true
# Port to use for the API URL.
port = 55321
# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API
# endpoints. `public` and `graphql_public` schemas are included by default.
schemas = ["public", "graphql_public"]
# Extra schemas to add to the search_path of every request.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returns from a view, table, or stored procedure. Limits payload size
# for accidental or malicious requests.
max_rows = 1000

[api.tls]
# Enable HTTPS endpoints locally using a self-signed certificate.
enabled = false

[db]
# Port to use for the local database URL.
port = 55322
# Port used by db diff command to initialize the shadow database.
shadow_port = 55320
# Same major version as the shared project audited in Phase 1 (PostgreSQL 17).
major_version = 17

[db.pooler]
enabled = false
# Port to use for the local connection pooler.
port = 55329
# Specifies when a server connection can be reused by other clients.
# Configure one of the supported pooler modes: `transaction`, `session`.
pool_mode = "transaction"
# How many server connections to allow per user/database pair.
default_pool_size = 20
# Maximum number of client connections allowed.
max_client_conn = 100

[db.migrations]
# If disabled, migrations will be skipped during a db push or reset.
enabled = true
# Specifies an ordered list of schema files that describe your database.
schema_paths = []

[db.seed]
# Off (decided in Phase 4): no data seeds; Phase 5 copies the real data. See supabase/migrations/README.md.
enabled = false
sql_paths = ["./seed.sql"]

[db.network_restrictions]
# Enable management of network restrictions.
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

[realtime]
# Off: no ScoryDesign table is in supabase_realtime and src/ uses no .channel()/postgres_changes
# (DEPLOYED_SCHEMA_AUDIT.md §7).
enabled = false

[studio]
enabled = true
# Port to use for Supabase Studio.
port = 55323
# External URL of the API server that frontend connects to.
api_url = "http://127.0.0.1"
# OpenAI API Key to use for Supabase AI in the Supabase Studio.
openai_api_key = "env(OPENAI_API_KEY)"

# Email testing server (replaces the deprecated [inbucket]). Emails are not sent; they are shown
# in the web interface.
[local_smtp]
enabled = true
# Port to use for the email testing server web interface.
port = 55324
# Uncomment to expose additional ports (keep them inside 55320-55329).
# smtp_port = 55325
# pop3_port = 55326

[storage]
enabled = true
# Phase 5 measured the largest object in the 6 buckets: 39,114,234 bytes (design-images); 50 MiB is enough.
# [storage.image_transformation] stays off: 0 stored URLs use /render/image/.
file_size_limit = "50MiB"

[auth]
enabled = true
# Vite dev server of ScoryDesign (vite.config.ts / scripts/dev-local.mjs).
site_url = "http://127.0.0.1:3000"
# A list of *exact* URLs (or globs) that auth providers are permitted to redirect to.
additional_redirect_urls = [
  "http://127.0.0.1:3000",
  "http://127.0.0.1:3000/**",
  "http://localhost:3000",
  "http://localhost:3000/**",
]
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour), maximum 604,800 (1 week).
jwt_expiry = 3600
# If disabled, the refresh token will never expire.
enable_refresh_token_rotation = true
# Allows refresh tokens to be reused after expiry, up to the specified interval in seconds.
refresh_token_reuse_interval = 10
# Single local user (ADR-0004): public signup is disabled.
enable_signup = false
# Allow/disallow anonymous sign-ins to your project.
enable_anonymous_sign_ins = false
# Allow/disallow testing manual linking of accounts
enable_manual_linking = false
# Passwords shorter than this value will be rejected as weak. Minimum 6, recommended 8 or more.
minimum_password_length = 6
password_requirements = ""

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
# Must stay true: in the CLI this flag enables the email provider itself (false = "Email logins are
# disabled", Phase 5). Public signup stays off through [auth] enable_signup = false (ADR-0004).
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
# DO NOT commit your Twilio auth token to git. Use environment variable substitution instead:
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.external.apple]
enabled = false
client_id = ""
# DO NOT commit your OAuth provider secret to git. Use environment variable substitution instead:
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false
email_optional = false

[auth.web3.solana]
enabled = false

[auth.third_party.firebase]
enabled = false

[auth.third_party.auth0]
enabled = false

[auth.third_party.aws_cognito]
enabled = false

[auth.third_party.clerk]
enabled = false

[auth.oauth_server]
enabled = false
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false

[edge_runtime]
# On: serves the whole supabase/functions folder (ADR-0006). Secrets: supabase/functions/.env (ignored).
enabled = true
# `per_worker` (default) enables hot reload; `oneshot` is the fallback if hot reload causes issues.
policy = "per_worker"
# Port to attach the Chrome inspector for debugging edge functions.
inspector_port = 55328
# The Deno major version to use.
deno_version = 2

[analytics]
# Off: Vector restarted on Docker Desktop in agents-finmarket.
enabled = false
port = 55327
backend = "postgres"

[experimental]
orioledb_version = ""
s3_host = "env(S3_HOST)"
s3_region = "env(S3_REGION)"
s3_access_key = "env(S3_ACCESS_KEY)"
s3_secret_key = "env(S3_SECRET_KEY)"

# ---------------------------------------------------------------------------
# Edge Functions: sections kept identical to the previous config.toml.
# ---------------------------------------------------------------------------

[functions.generate-design-image]
verify_jwt = false

[functions.generate-design-mockups]
verify_jwt = false

[functions.generate-design-copy]
verify_jwt = false

# Carousel script requires a real session: it validates business membership
# before reading tenant data, instead of trusting the business_id in the body.
[functions.generate-carousel-script]
verify_jwt = true

[functions.generate-design-html]
verify_jwt = false

[functions.generate-ideas]
verify_jwt = false

[functions.generate-strategy]
verify_jwt = false

[functions.generate-variants]
verify_jwt = false

[functions.adapt-channel]
verify_jwt = false

[functions.refine-branch]
verify_jwt = false

[functions.render-design-png]
verify_jwt = false

[functions.compliance-wizard]
verify_jwt = true

# Isolated experiment: getUser + database membership checks inside the handler.
[functions.desaing-server]
verify_jwt = true

# Lightweight authenticated state boundary for reads, recovery and reviews.
[functions.desaing-state]
verify_jwt = true

# Administrative pilot: every request requires the separate secret pilot token.
# No browser integration; pinned actor/business, expiry and USD 5 policy in handler.
[functions.desaing-pilot]
verify_jwt = false
