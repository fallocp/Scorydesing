<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1f6fd"><title>ScoryDesign · Prototipo visual</title><style>/* ScoryDesign — proposed implementation tokens for the approved light/cobalt direction.
   Scoped under .sd-root; never overwrite global tokens in the host application. */
.sd-root {
 --sd-bg:#f1f6fd; --sd-surface:#fff; --sd-ink:#101b3b; --sd-muted:#60718c;
 --sd-blue:#0866ff; --sd-blue-dark:#004dd8; --sd-blue-pale:#e9f2ff;
 --sd-line:#dae5f5; --sd-line-soft:#e6edf8; --sd-violet:#7955f8;
 --sd-green:#18af8e; --sd-orange:#ff8a3c;
 --sd-radius-sm:10px; --sd-radius-md:16px; --sd-radius-lg:22px; --sd-radius-xl:28px;
 --sd-shadow:0 10px 32px rgba(29,67,120,.055); --sd-shadow-blue:0 7px 17px rgba(8,102,255,.22);
 --sd-font:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
 --sd-sidebar:220px; --sd-gap:18px;
 font-family:var(--sd-font); color:var(--sd-ink);
}


/* Styles are intentionally namespaced. demo-page styles belong only to the standalone preview. */
.sd-root,.sd-root * {box-sizing:border-box;}
.sd-root {min-height:100vh;display:grid;grid-template-columns:var(--sd-sidebar) minmax(0,1fr);gap:var(--sd-gap);padding:18px;max-width:1920px;margin:auto;background:radial-gradient(ellipse at 82% 8%,#e5efff55,transparent 52%),var(--sd-bg);font-size:14px;line-height:1.5;}
.sd-root button,.sd-root input,.sd-root textarea,.sd-root select {font:inherit;}
.sd-root button {cursor:pointer;color:inherit;} .sd-root button:disabled {cursor:not-allowed;opacity:.48;box-shadow:none;transform:none;}
.sd-root h1,.sd-root h2,.sd-root h3,.sd-root p {margin:0;} .sd-root svg {display:block;flex-shrink:0;}
.sd-root button,.sd-root a,.sd-root input,.sd-root textarea,.sd-root select { -webkit-tap-highlight-color:transparent; }
.sd-root :focus-visible {outline:3px solid #0966ff88;outline-offset:4px;}
.sd-root img {display:block;max-width:100%;}
.sd-visually-hidden {position:absolute!important;width:1px!important;height:1px!important;margin:-1px!important;padding:0!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important;}
.sd-sidebar {position:sticky;top:18px;height:calc(100vh - 36px);min-height:720px;display:flex;flex-direction:column;padding:25px 13px 14px;border:1px solid #ffffffef;border-radius:var(--sd-radius-xl);background:linear-gradient(155deg,#ffffffec,#f9fbffee 60%,#f5f9ff);box-shadow:var(--sd-shadow);}
.sd-brand {display:flex;align-items:center;gap:9px;border:0;background:none;padding:0 11px;margin-bottom:32px;text-align:left;font-weight:730!important;letter-spacing:-1px;font-size:22px!important;white-space:nowrap;}
.sd-brand-blue {color:var(--sd-blue);font-weight:510;}
.sd-brand-mark {display:block;position:relative;width:31px;height:36px;flex-shrink:0;}
.sd-brand-mark i {display:block;position:absolute;width:24px;height:20px;border:5px solid var(--sd-blue);border-radius:7px;transform:skew(-13deg);left:3px;top:2px;}
.sd-brand-mark i:first-child {border-right-color:transparent;} .sd-brand-mark i:last-child {top:14px;border-left-color:transparent;border-color:#196bff;border-left-color:transparent;}
.sd-nav {display:flex;flex-direction:column;gap:5px;}
.sd-nav-item {position:relative;display:flex;align-items:center;gap:11px;min-height:48px;text-align:left;width:100%;padding:7px 11px;border:1px solid transparent;background:transparent;border-radius:14px;font-size:13px!important;font-weight:510;transition:background .15s,box-shadow .15s;}
.sd-nav-item:hover {background:#edf3fc;}
.sd-nav-item.is-active {color:white;background:linear-gradient(170deg,#408bff 0%,#0967ff 47%,#0060f6);border-color:#75adff;box-shadow:inset 0 1px 2px #ffffffa6,0 6px 14px #0966ff2c;}
.sd-nav-item.is-active .sd-app-icon {color:white;background:#ffffff15;box-shadow:inset 0 1px 1px #ffffff30;border-color:#ffffff15;}
.sd-nav-dot {width:4px;height:4px;border-radius:50%;background:#ffffff95;margin-left:auto;}
.sd-nav-break {margin-top:16px;}
.sd-sidebar-bottom {margin-top:auto;padding-top:28px;}
.sd-studio-note {position:relative;overflow:hidden;isolation:isolate;margin:0 7px 18px;padding:20px 16px;border-radius:18px;background:linear-gradient(135deg,#f4f8ff,#e2eeff);border:1px solid #fff;}
.sd-mini-kicker {font-size:8px;letter-spacing:1.6px;color:#536e97;font-weight:700;}
.sd-studio-note p {font-size:18px;letter-spacing:-.55px;line-height:1.33;padding:12px 0 14px;position:relative;z-index:1;}
.sd-studio-note b {font-weight:650;color:var(--sd-blue);}
.sd-note-orbit {position:absolute;right:-37px;bottom:-32px;width:150px;height:155px;border:22px solid #a9c9fa65;border-radius:36px;transform:rotate(32deg);z-index:0;}
.sd-system-link {font-size:12px!important;margin-bottom:10px;}
.sd-account {border-top:1px solid var(--sd-line-soft);display:flex;align-items:center;gap:9px;padding:15px 8px 2px;}
.sd-avatar {display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;background:linear-gradient(#e8f0fb,#dce6f5);color:#40577d;border:1px solid #ffffffa6;border-radius:50%;width:36px;height:36px;font-size:12px;}
.sd-account strong {display:block;font-size:12px;font-weight:650;}
.sd-account small {display:block;font-size:10px;color:var(--sd-muted);}
.sd-account-dot {width:6px;height:6px;border-radius:50%;background:#adbdd0;margin-left:auto;}
.sd-main-shell {min-width:0;}
.sd-topbar {display:flex;align-items:center;gap:16px;height:65px;margin-bottom:17px;padding:0 20px;background:#ffffffd6;border:1px solid white;border-radius:20px;box-shadow:var(--sd-shadow);}
.sd-business {display:flex;align-items:center;gap:9px;white-space:nowrap;background:white;border:1px solid var(--sd-line-soft);border-radius:10px;min-height:35px;padding:0 12px;font-size:12px!important;font-weight:600;}
.sd-business svg {transform:rotate(90deg);margin-left:10px;}
.sd-business-dot {width:7px;height:7px;background:var(--sd-blue);border-radius:50%;}
.sd-top-divider {height:23px;width:1px;background:var(--sd-line-soft);}
.sd-search {display:flex;align-items:center;gap:10px;max-width:575px;flex:1;min-width:80px;color:#506994;}
.sd-search input {width:100%;border:0;background:transparent;outline:none;font-size:12px;color:var(--sd-ink);padding:10px 0;}
.sd-root input::placeholder,.sd-root textarea::placeholder {color:#7689a4;}
.sd-search kbd {border:1px solid var(--sd-line-soft);border-radius:5px;background:#f8faff;padding:0 5px;color:#798ba7;font-size:11px;}
.sd-prototype-tag {margin-left:auto;background:#edf4ff;color:#5675a4;padding:4px 8px;border-radius:7px;font-size:9px;font-weight:600;letter-spacing:.35px;}
.sd-icon-button {display:inline-flex;align-items:center;justify-content:center;width:35px;height:35px;border:1px solid var(--sd-line-soft);border-radius:11px;background:#ffffffa6;flex-shrink:0;padding:0;}
.sd-icon-button:hover {background:#eaf2ff;}
.sd-mobile-menu,.sd-scrim {display:none;}
.sd-workspace {padding:0 0 4px;min-height:730px;}
.sd-eyebrow {display:block;font-size:10px;font-weight:650;color:#6080ae;letter-spacing:1.8px;line-height:1.4;}
.sd-hero {position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(115deg,#eff5ff,#f9fcff 65%,#d9e8fa);border-radius:22px;border:1px solid #fff;min-height:325px;box-shadow:var(--sd-shadow);}
.sd-hero-art {position:absolute;inset:0 0 0 33%;background-size:cover;background-position:75% 53%;opacity:.95;z-index:-3;}
.sd-hero-haze {position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,#f4f8ff 0%,#f4f8fffa 35%,#f4f8ffcf 43%,#f4f8ff19 67%,transparent 95%);}
.sd-hero-content {padding:31px 33px 95px;}
.sd-hero h1 {font-size:clamp(38px,4vw,59px);font-weight:760;line-height:1.06;letter-spacing:-2.5px;margin:15px 0 16px;max-width:580px;}
.sd-hero h1 span {color:var(--sd-blue);}
.sd-hero-content>p {font-size:14px;line-height:1.65;color:#536c91;max-width:390px;}
.sd-hero-caption {position:absolute;right:22px;top:24px;text-align:right;font-size:8px;letter-spacing:2px;font-weight:650;color:#304c76;background:#f1f6fdc7;padding:9px 10px;border-radius:8px;}
.sd-hero-caption i {display:block;width:20px;height:2px;background:var(--sd-blue);margin:9px 0 0 auto;}
.sd-prompt-bar {position:absolute;left:29px;right:29px;bottom:25px;display:flex;align-items:center;gap:13px;background:#ffffffec;border:1px solid #c5d9f7;border-radius:17px;padding:7px 7px 7px 18px;box-shadow:0 8px 24px #1e5ba610,inset 0 0 0 3px #ffffff90;backdrop-filter:blur(12px);color:var(--sd-blue);}
.sd-prompt-bar>input {height:40px;min-width:0;flex:1;border:0;background:none;outline:none;color:var(--sd-ink);font-size:13px;}
.sd-button {display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:43px;border-radius:11px;border:1px solid transparent;padding:10px 18px;font-size:12px!important;font-weight:590;line-height:1.2;transition:box-shadow .16s,background .16s,transform .16s;text-decoration:none;}
.sd-button:not(:disabled):hover {transform:translateY(-1px);}
.sd-primary {background:linear-gradient(174deg,#2582ff 0%,#0968ff 52%,#0060f6);border-color:#68a5ff;color:white!important;box-shadow:inset 0 1px 1px #ffffff85,var(--sd-shadow-blue);}
.sd-primary:hover {background:linear-gradient(174deg,#1a75fc,#0059ea);}
.sd-secondary {background:#ffffffdf;border-color:var(--sd-line);color:#274979!important;}
.sd-text-button {display:inline-flex;align-items:center;gap:8px;color:var(--sd-blue)!important;background:none;border:0;padding:7px 0;font-size:12px!important;}
.sd-module-grid {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:17px;}
.sd-module-card {display:block;text-align:left;min-width:0;padding:18px;border-radius:18px;border:1px solid #dfe9f8;background:linear-gradient(130deg,white,#ffffffc7);box-shadow:0 5px 20px #1f426205;transition:transform .18s,box-shadow .18s,border-color .18s;}
.sd-module-card:hover {transform:translateY(-3px);box-shadow:0 10px 22px #1343870d;border-color:#bcd2f4;}
.sd-card-top {display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;}
.sd-app-icon {display:inline-flex;align-items:center;justify-content:center;width:47px;height:47px;border-radius:14px;position:relative;flex-shrink:0;background:linear-gradient(150deg,#fcfdff,#e9f0fa);color:#244475;border:1px solid #dce7f8;box-shadow:inset 0 1px 1px white,0 3px 8px #15396108;}
.sd-app-icon:after {content:"";position:absolute;inset:2px;border-radius:11px;border-top:1px solid #ffffff75;pointer-events:none;}
.sd-icon-small {width:30px;height:30px;border-radius:9px;}
.sd-icon-small:after {border-radius:7px;}
.sd-tone-blue {color:white;background:linear-gradient(145deg,#70afff 0%,#1878ff 42%,#0060ef 100%);border-color:#59a0ff;box-shadow:inset 0 1px 2px #ffffff75,0 5px 11px #0866ff27;}
.sd-tone-violet {color:white;background:linear-gradient(145deg,#b697ff,#8b60ff 40%,#683fe9);border-color:#b398ff;box-shadow:inset 0 1px 2px #ffffff85,0 4px 11px #7955f824;}
.sd-tone-green {color:white;background:linear-gradient(145deg,#70e0c2,#25c09b 45%,#0d9d81);border-color:#63d8bb;box-shadow:inset 0 1px 2px #ffffff80,0 4px 11px #18af8e22;}
.sd-tone-orange {color:white;background:linear-gradient(145deg,#ffc796,#ff944d 42%,#f67b27);border-color:#ffb579;box-shadow:inset 0 1px 2px #ffffff85,0 4px 11px #ff8a3c20;}
.sd-tone-navy {color:white;background:linear-gradient(145deg,#5b769b,#293d61);border-color:#7b93b3;}
.sd-circle-arrow {display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;border-radius:50%;background:#edf3fc;color:#385886;flex-shrink:0;}
.sd-module-card h3 {font-size:16px;font-weight:680;letter-spacing:-.45px;margin-bottom:7px;}
.sd-module-card p {font-size:12px;line-height:1.5;color:var(--sd-muted);max-width:220px;}
.sd-module-card.is-selected {border-color:var(--sd-blue);box-shadow:0 0 0 1px var(--sd-blue),0 6px 20px #0a65ff10;background:#f8fbff;}
.sd-module-card.is-selected .sd-circle-arrow {color:white;background:var(--sd-blue);}
.sd-section {margin-top:24px;}
.sd-section-heading {display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px;}
.sd-section-heading h2 {font-size:19px;font-weight:690;letter-spacing:-.6px;}
.sd-subtle-label {font-size:9px;color:#7187a7;letter-spacing:1.25px;}
.sd-project-grid {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;}
.sd-project-card {border:0;padding:0;background:transparent;text-align:left;min-width:0;}
.sd-project-image {position:relative;height:124px;background:#d8e5f5;border-radius:12px;overflow:hidden;border:1px solid #ffffffa5;}
.sd-project-image img {width:100%;height:100%;object-fit:cover;transition:transform .25s;}
.sd-project-card:hover img {transform:scale(1.04);}
.sd-project-type {position:absolute;bottom:8px;left:8px;font-size:9px;background:#f8fbffe8;border-radius:5px;padding:2px 6px;color:#234069;}
.sd-project-more {position:absolute;top:8px;right:8px;border-radius:8px;background:#ffffffc9;padding:4px;}
.sd-project-card h3 {margin:8px 2px 2px;font-size:12px;font-weight:650;}
.sd-project-card p {font-size:10px;color:var(--sd-muted);margin:0 2px;}
.sd-quick-section {margin-top:24px;}
.sd-quick-grid {display:grid;grid-template-columns:1fr 1fr;gap:15px;}
.sd-quick-card {display:flex;align-items:center;gap:16px;min-height:96px;border:1px solid #dbe8fa;background:linear-gradient(115deg,#fafdff,#e8f1ff);border-radius:18px;padding:20px;text-align:left;}
.sd-quick-card>div {flex:1;min-width:0;}
.sd-quick-card h3 {font-size:15px;font-weight:660;margin-bottom:5px;letter-spacing:-.35px;}
.sd-quick-card p {font-size:11px;color:var(--sd-muted);}
.sd-fx-card {background:linear-gradient(125deg,#f9fbff,#edf3fc);}
.sd-footer {display:flex;justify-content:space-between;gap:15px;color:#8496b1;font-size:9px;letter-spacing:.2px;padding:17px 3px 0;}
.sd-toast {position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:max-content;max-width:min(680px,calc(100vw - 32px));display:flex;align-items:center;gap:17px;background:#172443;color:white;padding:13px 13px 13px 20px;border-radius:16px;box-shadow:0 12px 45px #101b3b33;z-index:100;font-size:13px;}
.sd-toast .sd-icon-button {background:#ffffff16;color:white;border-color:#ffffff23;}
.sd-page-heading {display:flex;align-items:center;justify-content:space-between;gap:25px;margin:22px 4px 25px;}
.sd-page-heading h1,.sd-create-heading h1 {font-size:34px;line-height:1.2;font-weight:730;letter-spacing:-1.1px;margin:9px 0;}
.sd-page-heading p {font-size:13px;color:var(--sd-muted);margin-top:9px;}
.sd-create-heading {display:flex;align-items:center;justify-content:space-between;gap:15px;margin:20px 5px;}
.sd-steps {display:flex;align-items:center;gap:5px;border:1px solid #fff;background:#ffffffbf;padding:8px;border-radius:14px;margin-bottom:18px;}
.sd-step {flex:1;display:flex;align-items:center;justify-content:center;gap:9px;padding:9px 4px;border:0;background:none;border-radius:10px;font-size:11px!important;color:#75869f!important;}
.sd-step>span {width:23px;height:23px;border-radius:50%;border:1px solid #cedbec;display:flex;align-items:center;justify-content:center;font-size:10px;}
.sd-step.is-current {color:var(--sd-blue)!important;background:#edf4ff;font-weight:650;}
.sd-step.is-current>span,.sd-step.is-complete>span {background:var(--sd-blue);color:white;border-color:var(--sd-blue);}
.sd-step.is-complete {color:#46648d!important;}
.sd-create-layout {display:grid;grid-template-columns:250px minmax(0,1fr);gap:17px;align-items:stretch;}
.sd-chat-panel {border:1px solid white;border-radius:20px;background:#fcfdff;display:flex;flex-direction:column;min-height:600px;overflow:hidden;}
.sd-chat-title {display:flex;align-items:center;gap:10px;padding:18px;border-bottom:1px solid var(--sd-line-soft);}
.sd-chat-title strong {display:block;font-size:13px;font-weight:650;}
.sd-chat-title small {display:block;font-size:10px;color:var(--sd-muted);}
.sd-chat-content {padding:18px;flex:1;}
.sd-chat-bubble {padding:14px;border-radius:2px 14px 14px 14px;background:#edf3fc;color:#3e5579;font-size:12px;line-height:1.65;margin-bottom:16px;}
.sd-chat-user {border-radius:14px 14px 2px 14px;background:#e4efff;color:#1f3b66;margin-left:13px;}
.sd-context-summary {border-top:1px solid var(--sd-line-soft);padding-top:20px;margin-top:26px;}
.sd-context-summary>.sd-eyebrow {font-size:8px;margin-bottom:14px;}
.sd-context-summary>div {display:flex;align-items:center;justify-content:space-between;font-size:10px;margin:9px 0;gap:12px;}
.sd-context-summary>div>span {color:var(--sd-muted);}
.sd-context-summary strong {font-weight:600;}
.sd-chat-bottom {padding:15px;border-top:1px solid var(--sd-line-soft);}
.sd-chat-bottom>.sd-button {width:100%;margin-top:12px;}
.sd-demo-note {font-size:10px!important;line-height:1.6!important;color:#7688a0!important;}
.sd-stage {border:1px solid #fff;background:#ffffffdb;border-radius:21px;padding:25px;min-height:600px;display:flex;flex-direction:column;min-width:0;}
.sd-stage-title {margin-bottom:24px;}
.sd-stage-title h2 {font-size:25px;line-height:1.25;letter-spacing:-.75px;font-weight:710;margin:4px 0 9px;}
.sd-stage-title p {font-size:12px;line-height:1.6;color:var(--sd-muted);}
.sd-stage .sd-module-grid {grid-template-columns:repeat(2,minmax(0,1fr));margin:0 0 22px;}
.sd-stage .sd-module-card {min-height:161px;}
.sd-soft-note {display:flex;gap:11px;align-items:center;padding:15px 17px;background:#f1f6fd;border:1px solid var(--sd-line-soft);border-radius:12px;font-size:11px;color:#4b658a;line-height:1.6;}
.sd-stage-footer {display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:26px;margin-top:auto;}
.sd-stage-footer>.sd-demo-note {text-align:center;}
.sd-format-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-bottom:25px;}
.sd-format-card {text-align:left;background:#fff;border:1px solid var(--sd-line);border-radius:14px;padding:15px;min-height:213px;}
.sd-format-card.is-selected {box-shadow:0 0 0 1px var(--sd-blue);border-color:var(--sd-blue);background:#f9fbff;}
.sd-format-title {display:flex;align-items:center;justify-content:space-between;gap:5px;font-size:11px;}
.sd-format-card>small {font-size:9px;color:var(--sd-muted);}
.sd-select-mark {height:18px;width:18px;display:flex;align-items:center;justify-content:center;border:1px solid #c5d5eb;border-radius:50%;flex-shrink:0;}
.is-selected .sd-select-mark {background:var(--sd-blue);color:white;border-color:var(--sd-blue);}
.sd-format-visual {height:142px;margin-top:12px;display:flex;align-items:center;justify-content:center;background:#eef3fa;border-radius:9px;padding:10px;}
.sd-format-example {max-width:100%;max-height:125px;height:100%;background:#fff;border-radius:5px;box-shadow:0 2px 7px #263d5620;position:relative;overflow:hidden;min-width:65px;}
.sd-format-example>span {display:block;font-size:5px;padding:6px 7px;color:#32466c;}
.sd-format-example>strong {display:block;font-size:7px;line-height:1.3;padding:3px 7px;position:relative;z-index:1;}
.sd-format-example>img {position:absolute;bottom:0;width:100%;height:47%;object-fit:cover;}
.sd-segmented {display:inline-flex;align-items:center;background:#eaf1fb;border:1px solid #dfe8f6;padding:4px;border-radius:12px;gap:3px;flex-wrap:wrap;}
.sd-segmented>button {border:0;border-radius:8px;background:none;padding:9px 13px;font-size:11px!important;color:#647b9d;}
.sd-segmented>button.is-active {background:#fff;color:var(--sd-blue);font-weight:650;box-shadow:0 1px 4px #1d47701c;}
.sd-content-grid {display:grid;grid-template-columns:1.1fr 1fr;gap:24px;margin-top:22px;margin-bottom:20px;align-items:start;}
.sd-copy-option {text-align:left;width:100%;padding:16px;background:#f5f9ff;border:1px solid #83b3ff;border-radius:12px;margin-bottom:18px;}
.sd-copy-option strong {display:block;font-size:16px;line-height:1.4;margin:9px 0 7px;letter-spacing:-.4px;}
.sd-copy-option small {display:block;font-size:9px;color:var(--sd-muted);}
.sd-badge {display:inline-flex;align-items:center;width:max-content;max-width:100%;font-size:9px;line-height:1.4;font-weight:570;color:#426daa;background:#e9f2ff;border:1px solid #d8e7fe;padding:4px 7px;border-radius:6px;}
.sd-field {display:block;font-size:11px;font-weight:620;color:#33486b;margin-bottom:15px;}

  if(['children','key','ref'].includes(k)||k.startsWith('on')||v===undefined||v===null)continue;
  if((type==='textarea'||type==='select')&&k==='value')continue;
  if(k==='style'){const styles=Object.entries(v).map(([name,value])=>{const css=name.startsWith('--')?name:name.replace(/[A-Z]/g,c=>'-'+c.toLowerCase());return css+':'+(typeof value==='number'&&!unitless.has(name)?value+'px':value);}).join(';');attrs+=' style="'+escape(styles)+'"';continue;}
  const name=({className:'class',htmlFor:'for',tabIndex:'tabindex',readOnly:'readonly',strokeWidth:'stroke-width',strokeLinecap:'stroke-linecap',strokeLinejoin:'stroke-linejoin',fillRule:'fill-rule',clipRule:'clip-rule'}[k]||k);
  if(typeof v==='boolean'&&!name.startsWith('aria-')&&!name.startsWith('data-')){if(v)attrs+=' '+name;continue;}
  attrs+=' '+name+'="'+escape(v)+'"';
 }
 if(type==='option'&&String(props.value??props.children)===String(selectValue))attrs+=' selected';
 if(voidTags.has(type))return '<'+type+attrs+'>';
 const children=type==='textarea'?(props.value??props.children):props.children;
 return '<'+type+attrs+'>'+render(children,type==='select'?props.value:selectValue)+'</'+type+'>';
}
const {initialState}=req('data'), {DesignView}=req('DesignView'), actions=req('demo-controller');
let state=JSON.parse(JSON.stringify(initialState));
const initialView=location.hash.slice(1).split('/');
if(['create','library','editor','brand','icons'].includes(initialView[0]))state.view=initialView[0];
if(initialView[0]==='create'&&/^[0-4]$/.test(initialView[1]||''))state.step=Number(initialView[1]);
const mount=document.getElementById('root');
function draw(){
 const focused=document.activeElement, field=focused&&focused.dataset&&focused.dataset.field;
 let selection=null;try{if(field&&typeof focused.selectionStart==='number')selection=[focused.selectionStart,focused.selectionEnd];}catch{}
 mount.innerHTML=render(DesignView({state}));
 if(field){const el=mount.querySelector('[data-field="'+CSS.escape(field)+'"]');if(el){el.focus({preventScroll:true});if(selection)try{el.setSelectionRange(selection[0],selection[1]);}catch{}}}
}
function dispatch(action,value){const previousView=state.view;state=actions.reduceDemo(state,action,value||'');draw();if(previousView!==state.view)window.scrollTo(0,0);}
mount.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target||target.tagName==='SELECT'||target.disabled)return;event.preventDefault();const action=target.dataset.action;if(action==='export-demo'){actions.downloadDemoPresentation(state);return;}dispatch(action,target.dataset.value);});
mount.addEventListener('submit',event=>{event.preventDefault();dispatch(event.target.dataset.form==='search'?'search':'start');});
mount.addEventListener('input',event=>{const el=event.target;if(el.dataset.field){state=actions.updateField(state,el.dataset.field,el.value);draw();}});
mount.addEventListener('change',async event=>{const el=event.target;if(el.dataset.action==='ref-role'){state=actions.updateReferenceRole(state,el.dataset.id,el.value);draw();return;}if(el.type==='file'&&el.dataset.upload){const files=Array.from(el.files||[]);el.value='';if(!files.length)return;try{const refs=await actions.readReferences(files);state=actions.appendReferences(state,refs);}catch(e){state={...state,notice:e instanceof Error?e.message:'No se pudo leer el archivo.'};}draw();}});
draw();
</script></body></html>
