<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Poppins:wght@400;500;600&display=swap">
<style>
html, body { margin: 0; }
.slide { position: relative; width: 1920px; height: 1080px; background: #F5F3F0; font-family: 'Poppins', sans-serif; overflow: hidden; }
.eyebrow { position: absolute; left: 0; right: 0; top: 300px; margin: 0; text-align: center; font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: #FF7A4A; }
.title { position: absolute; left: 0; right: 0; top: 360px; margin: 0; text-align: center; font-family: 'Montserrat', sans-serif; font-size: 64px; font-weight: 800; color: #0F2A4A; }
.title .cap { color: #FF7A4A; font-style: italic; }
.rule { position: absolute; left: 900px; top: 470px; width: 120px; height: 4px; border-radius: 2px; background: #2ED4C7; }
.sub { position: absolute; left: 0; right: 0; top: 510px; margin: 0; text-align: center; font-size: 26px; color: #5B6573; }
</style></head>
<body><main class="slide">
  <p class="eyebrow">Xending Capital</p>
  <h1 class="title">Financiamiento para <span class="cap">importar</span></h1>
  <div class="rule"></div>
  <p class="sub">Presentación comercial 2026</p>
</main></body></html>
